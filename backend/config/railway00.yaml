# Global configuration information
layout_name: "Hlavní trať Brno - Havlíčkův Brod"
location: "Klubovna"
version: "1.0"
note: "Rozšířená konfigurace pro 4 stanice a 16 prvků"

groups:
  # --- 1. STATION ---
  - name: "Nádraží Kuřim"
    note: "Hlavní stanice a přilehlé kolejiště"
    items:
      # Subgroup in Kuřim
      - name: "Budova nádraží"
        items:
          - name: "Čekárna a kasy"
            algorithm: "domacnost"
            address: "1:0"

          - name: "Kancelář výpravčího"
            algorithm: "trvale_zapnuto"
            address: "1:1"

      # Another subgroup in Kuřim
      - name: "Nástupiště a perony"
        items:
          - name: "Peron 1"
            algorithm: "drazni_osvetleni"
            address: "1:2"

          - name: "Peron 2"
            algorithm: "drazni_osvetleni"
            address: "1:3"

  # --- 2. STATION ---
  - name: "Město Židenice"
    note: "Rezidenční a komerční oblast u trati"
    items:
      # Items directly under the station (no subgroups)
      - name: "Ulice Nádražní"
        algorithm: "poulicni_lampa"
        address: "1:4"

      - name: "Hospoda U Zastávky"
        algorithm: "trvale_zapnuto"
        address: "1:5"

      - name: "Bytovka - přízemí"
        algorithm: "domacnost"
        address: "1:6"

      - name: "Odstavená budova"
        algorithm: "trvale_vypnuto"
        address: "1:7"

  # --- 3. STATION ---
  - name: "Zastávka Česká"
    note: "Malá lokální zastávka v lese"
    items:
      - name: "Přístřešek pro cestující"
        algorithm: "poulicni_lampa"
        address: "1:8"

      - name: "Lampa na přejezdu"
        algorithm: "drazni_osvetleni"
        address: "1:9"

      - name: "Hradlo"
        algorithm: "domacnost"
        address: "1:10"

      - name: "Služební cesta"
        algorithm: "drazni_osvetleni"
        address: "1:11"

  # --- 4. STATION ---
  - name: "Skryté nádraží"
    note: "Technické zázemí pod panelem, není vidět zvenku"
    items:
      - name: "Servisní osvětlení - sekce A"
        algorithm: "trvale_zapnuto"
        address: "1:12"

      - name: "Servisní osvětlení - sekce B"
        algorithm: "trvale_vypnuto"
        address: "1:13"

      - name: "obchod"
        note: "nic"
        items:
          - name: "výloha"
            notes: "je rozbitá"
            items:
              - name: "LED panel"
                algorithm: "trvale_zapnuto"
                address: "1:14"
          - name: "reflektor"
            algorithm: "trvale_zapnuto"
            address: "1:15"