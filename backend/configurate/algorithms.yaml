# Po změně restartujte backend. Časy rozvrhů používají čas hJOP, je-li zapnutý.
sunrise: "5:32"
sunset: "20:09"
# Prodejna: denní čas rozsvícení a zhasnutí.
shop:
  opening_time: "07:00"
  closing_time: "19:00"
# Chodba: délka svícení a náhodné pauzy ve skutečných sekundách.
corridor:
  min_on_seconds: 20
  max_on_seconds: 30
  pause_min_seconds: 60
  pause_max_seconds: 300
# Domácnosti: délky svícení a minimální zhasnutí ve skutečných sekundách.
household:
  min_on_seconds: 30
  max_on_seconds: 300
  min_off_seconds: 30
  # Od time platí percent do další položky; end_percent = plynulý přechod.
  schedule:
    - time: "04:00"
      percent: 10
      end_percent: 50
    - time: "05:00"
      percent: 70
    - time: "06:00"
      percent: 50
    - time: "08:00"
      percent: 5
    - time: "19:00"
      percent: 70
    - time: "21:00"
      percent: 70
      end_percent: 40
    - time: "23:00"
      percent: 10
